<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aegis Vault</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><aside><div class="brand"><div class="logo">A</div><div><b>Aegis</b><span>Private Vault</span></div></div><nav id="nav"></nav><div class="privacy"><span>●</span><div><b>Zero-knowledge</b><small>Vault encrypted locally</small></div></div></aside>
<main><header><div><p class="eyebrow">PERSONAL VAULT</p><h1 id="title">Good evening</h1></div><div class="actions"><button class="ghost" id="lock">⌘ Lock</button><button class="primary" id="add">＋ Add item</button></div></header>
<section id="content"></section></main></div><div id="modal" class="modal hidden"><form id="itemForm" class="dialog"><div class="dialog-head"><div><p class="eyebrow">NEW VAULT ITEM</p><h2>Add login</h2></div><button type="button" class="icon" id="close">×</button></div><label>Name<input required id="name" placeholder="e.g. GitHub"></label><label>Username<input id="username" placeholder="you@example.com"></label><label>Password<div class="row"><input required id="password" type="text"><button type="button" class="ghost" id="generate">Generate</button></div></label><label>Website<input id="website" placeholder="https://"></label><button class="primary wide">Save encrypted item</button></form></div><script src="app.js"></script></body></html>
