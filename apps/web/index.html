<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b10"><meta name="description" content="Aegis — privacy-first encrypted password manager"><title>Aegis — Private Vault</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><aside><div class="brand"><div class="logo">A</div><div><b>Aegis</b><span>Private Vault</span></div></div><nav id="nav"></nav><div class="side-status"><div class="status-line"><i></i><span>Vault protected</span></div><small>Local-first · Zero-knowledge design</small></div></aside>
<main><header><div><p class="eyebrow">PERSONAL VAULT</p><h1 id="title">Overview</h1></div><div class="actions"><button class="ghost" id="lock">Lock vault</button><button class="primary" id="add">＋ Add item</button></div></header><section id="content"></section></main></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal hidden"><form id="itemForm" class="dialog"><div class="dialog-head"><div><p class="eyebrow">NEW VAULT ITEM</p><h2>Add login</h2></div><button type="button" class="icon" id="close" aria-label="Close">×</button></div><label>Name<input required id="name" autocomplete="off" placeholder="e.g. GitHub"></label><label>Username<input id="username" autocomplete="off" placeholder="you@example.com"></label><label>Password<div class="row"><input required id="password" type="text" autocomplete="new-password"><button type="button" class="ghost" id="generate">Generate</button></div></label><label>Website<input id="website" autocomplete="off" placeholder="https://"></label><button class="primary wide">Save item</button><p class="form-note">Demo vault data remains on this browser only. Production sync will use the Oracle-hosted encrypted API.</p></form></div>
<div id="lockscreen" class="lockscreen hidden"><div class="lockbox"><div class="logo big">A</div><h2>Aegis is locked</h2><p>Unlock to return to your private vault.</p><button class="primary" id="unlock">Unlock vault</button></div></div>
<script src="app.js"></script></body></html>
